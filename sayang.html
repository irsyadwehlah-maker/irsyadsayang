<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 17th Birthday Sayanggg! ✨</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #fbc2eb 100%);
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Kartu dengan efek Glassmorphism */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px 25px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            z-index: 10;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.6);
            animation: bounceIn 1s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(1); }
        }

        .badge {
            background: linear-gradient(45deg, #ff6b81, #ff4757);
            color: white;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(255, 107, 129, 0.4);
        }

        /* Styling Jam/Countdown */
        .clock-box {
            background: rgba(255, 240, 242, 0.9);
            border: 1px solid #ffcbd1;
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 15px;
        }

        .clock-title {
            font-size: 12px;
            color: #747d8c;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .clock-time {
            font-size: 20px;
            font-weight: 700;
            color: #ff4757;
            letter-spacing: 1px;
        }

        /* Styling Slider Foto */
        .slider-container {
            position: relative;
            width: 100%;
            height: 220px;
            margin-bottom: 20px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.7);
            color: #ff4757;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .slider-btn:hover {
            background: rgba(255, 255, 255, 0.95);
        }

        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }

        h1 {
            color: #2f3542;
            font-size: 26px;
            margin-bottom: 8px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .to {
            color: #747d8c;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .to span {
            color: #ff4757;
            font-weight: 700;
        }

        .message {
            color: #4b6584;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 20px;
            text-align: justify;
            background: rgba(255, 255, 255, 0.6);
            padding: 18px;
            border-radius: 15px;
            min-height: 180px;
        }

        /* Cursor Efek Ketik */
        .typing-text::after {
            content: '|';
            animation: blink 0.7s infinite;
            color: #ff4757;
            font-weight: bold;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .main-btn {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.3s ease;
            outline: none;
        }

        .main-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.6);
        }

        .surprise-text {
            display: none;
            margin-top: 20px;
            font-weight: 700;
            color: #ff4757;
            font-size: 15px;
            line-height: 1.5;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 12px;
            border: 2px dashed #ff6b81;
            border-radius: 15px;
            background: #fff0f2;
        }

        @keyframes fadeIn {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Elemen Balon */
        .balloon {
            position: absolute;
            bottom: -100px;
            width: 45px;
            height: 55px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: floatUp 5s linear forwards;
            pointer-events: none;
            z-index: 1;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 14px;
            background-color: rgba(0, 0, 0, 0.2);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-125vh) rotate(25deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">Sweet Seventeen 🪅</div>

        <!-- Fitur Jam Real-time -->
        <div class="clock-box">
            <div class="clock-title">⏱️ WAKTU SAAT INI</div>
            <div id="liveClock" class="clock-time">00:00:00</div>
        </div>

        <!-- Slider Foto Interaktif -->
        <div class="slider-container">
            <img class="slide active" src=gambara.jpg=1" alt="Foto 1">
            <img class="slide" src="https://picsum.photos/450/220?random=2" alt="Foto 2">
            <img class="slide" src="https://picsum.photos/450/220?random=3" alt="Foto 3">
            
            <button class="slider-btn prev-btn" onclick="ubahSlide(-1)">❮</button>
            <button class="slider-btn next-btn" onclick="ubahSlide(1)">❯</button>
        </div>

        <h1>🎉 Happy Birthday! 🎉</h1>
        <p class="to">Untuk: <span>Sayanggg</span></p>

        <!-- Pesan Romantis Panjang dengan Efek Ketik -->
        <div class="message">
            <span id="typedMessage" class="typing-text"></span>
        </div>

        <button id="btnSurprise" class="main-btn" onclick="bukaKejutan()">Klik Kejutan Utama ✨</button>

        <div id="surprise" class="surprise-text">
            ❤️ Terima kasih sudah menjadi alasan di balik senyumku setiap hari. I Love You So Much & Happy Sweet Seventeen! ❤️
        </div>
    </div>

    <!-- Audio Melodi Happy Birthday To You (Piano Instrumental) -->
    <audio id="bgMusic" src="https://cdn.pixabay.com/download/audio/2022/11/06/audio_c8907f16a1.mp3?filename=happy-birthday-to-you-piano-126291.mp3" preload="auto"></audio>

    <script>
        // Teks Ucapan Romantis dan Panjang
        const teksUcapan = "Selamat ulang tahun yang ke-17, Sayanggg! ✨ Di usiamu yang baru ini, aku berdoa agar setiap langkahmu selalu dipenuhi dengan kebahagiaan, kesehatan, dan hal-hal indah. Terima kasih ya sudah hadir dan memberi warna tersendiri dalam hidupku. Senyummu selalu jadi hal favoritku, dan aku akan selalu ada di sini untuk mendukung impian-impianmu. Tetaplah jadi dirimu yang hangat dan hebat. Happy Sweet Seventeen, cintaku! 💕🌸";
        
        let charIndex = 0;
        const speed = 40;

        function typeWriter() {
            if (charIndex < teksUcapan.length) {
                document.getElementById("typedMessage").innerHTML += teksUcapan.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, speed);
            }
        }

        window.onload = typeWriter;

        // Logika Slider Foto
        let slideIndex = 0;
        const slides = document.querySelectorAll('.slide');

        function ubahSlide(n) {
            slides[slideIndex].classList.remove('active');
            slideIndex = (slideIndex + n + slides.length) % slides.length;
            slides[slideIndex].classList.add('active');
        }

        setInterval(() => {
            ubahSlide(1);
        }, 4000);

        // Update Jam Real-time
        function updateJam() {
            const sekarang = new Date();
            const jam = String(sekarang.getHours()).padStart(2, '0');
            const menit = String(sekarang.getMinutes()).padStart(2, '0');
            const detik = String(sekarang.getSeconds()).padStart(2, '0');
            document.getElementById("liveClock").innerText = `${jam} : ${menit} : ${detik}`;
        }
        setInterval(updateJam, 1000);
        updateJam();

        // Tombol Kejutan Utama
        function bukaKejutan() {
            const surpriseDiv = document.getElementById("surprise");
            surpriseDiv.style.display = "block";

            const btn = document.getElementById("btnSurprise");
            btn.innerText = "Nikmati Harimu! 💖";
            btn.disabled = true;
            btn.style.opacity = "0.8";

            const music = document.getElementById("bgMusic");
            music.volume = 0.6;
            music.play().catch(e => console.log("Audio play error:", e));

            buatBalon();
            luncurkanKonfeti();
        }

        function buatBalon() {
            const warnaBalon = ['#ff4757', '#ff6b81', '#7bed9f', '#70a1ff', '#eccc68', '#ff7f50', '#a29bfe'];
            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const balloon = document.createElement('div');
                    balloon.classList.add('balloon');
                    balloon.style.left = Math.random() * 100 + 'vw';
                    const warnaRandom = warnaBalon[Math.floor(Math.random() * warnaBalon.length)];
                    balloon.style.backgroundColor = warnaRandom;
                    
                    const scale = Math.random() * 0.6 + 0.8;
                    balloon.style.transform = `scale(${scale})`;
                    balloon.style.animationDuration = (Math.random() * 3 + 4) + 's';

                    document.body.appendChild(balloon);

                    setTimeout(() => {
                        balloon.remove();
                    }, 6000);
                }, i * 120);
            }
        }

        function luncurkanKonfeti() {
            var count = 200;
            var defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }
    </script>
</body>
</html>
